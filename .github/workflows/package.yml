name: Package macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify architecture and version
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$(plutil -extract CFBundleShortVersionString raw -o - Sources/App/Info.plist)"
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "Tag $GITHUB_REF_NAME must match application version v$version." >&2
              exit 1
            fi
          fi
      - name: Run tests
        run: make test
      - name: Build and package
        run: make package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MakeTools-macos-${{ matrix.arch }}
          path: |
            build/MakeTools-v*-macos-${{ matrix.arch }}.dmg
            build/MakeTools-v*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: MakeTools-macos-*
          path: release
          merge-multiple: true
      - name: Publish DMG, ZIP archives and checksums
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          arm_dmg="MakeTools-${GITHUB_REF_NAME}-macos-arm64.dmg"
          intel_dmg="MakeTools-${GITHUB_REF_NAME}-macos-x86_64.dmg"
          arm_zip="MakeTools-${GITHUB_REF_NAME}-macos-arm64.zip"
          intel_zip="MakeTools-${GITHUB_REF_NAME}-macos-x86_64.zip"
          sha256sum "$arm_dmg" "$intel_dmg" "$arm_zip" "$intel_zip" > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$arm_dmg" "$intel_dmg" "$arm_zip" "$intel_zip" SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$arm_dmg" "$intel_dmg" "$arm_zip" "$intel_zip" SHA256SUMS.txt \
              --verify-tag --title "MakeTools $GITHUB_REF_NAME" --generate-notes \
              --notes '最低要求 macOS 14。arm64 适用于 Apple 芯片，x86_64 适用于 Intel。推荐下载 DMG 打开后将 MakeTools 拖入「应用程序」文件夹，也提供 ZIP 包。应用内含 Quick Look 扩展，采用 Ad-hoc 签名，未经 Apple 公证。'
          fi
